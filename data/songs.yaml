    artist: [Wolfgang Amadeus Mozart]
    composer: [Wolfgang Amadeus Mozart]
    universe: [Classical music]
    source: Piano Sonata No. 11 in A major, K. 331
    tags: [piano, energetic, classical]
    year: 1783
