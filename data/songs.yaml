  - id: lilla-regnvisa
    title: Lilla regnvisan
    language: Swedish
    description: |
      An original miniature written for testing Visor's Markdown lyrics and metadata search.
    lyrics: |
      Regnet ritar ringar,

      över tak och sten.

      När den sista droppen klingar,

      tittar solen fram igen.
    artist: [Visor]
    author: [Visor]
    composer: [Visor]
    universe: [Visor originals]
    tags: [rain, weather, calm, children]
    rights: original
