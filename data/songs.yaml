songs:
  - id: blinka-lilla-stjarna
    title: Blinka lilla stjärna
    alternate_titles: [Twinkle, Twinkle, Little Star]
    language: Swedish
    description: |
      A Swedish version of the familiar nursery song, set to a melody also used by Mozart for twelve piano variations.

      A gentle choice for bedtime or a first melody on the piano.
    lyrics: |
      **Blinka, lilla stjärna där,**

      hur jag undrar vad du är.

      Fjärran lockar du min syn,

      lik en diamant i skyn.
    artist: [Traditional]
    author: [Traditional]
    composer: [Traditional]
    universe: [Traditional songs]
    source: Swedish nursery song
    tags: [bedtime, stars, calm, children]
    rights: public-domain

