- id: imse-vimse-spindel
  title: Imse vimse spindel
  language: Swedish
  lyrics: |
    [C]Imse vimse spindel [G7]klättrar upp för [C]trå'n.
    [C]Ner faller regnet, [G7]spolar spindeln [C]bort.
    [C]Upp stiger solen, [G7]torkar bort allt [C]regn.
    [C]Imse vimse spindel [G7]klättrar upp i [C]gen.
  video: https://youtu.be/XO2EVGi1Rb4

- id: ba-ba-vita-lamm
  title: Bä bä vita lamm
  language: Swedish
  lyrics: |
    [C]Bä, bä, vita lamm, [G7]har du någon [C]ull?
    [C]Ja, ja, kära barn, [G7]jag har säcken [C]full.
    [F]Helgdagsrock åt far och [C]söndagskjol åt mor,
    [G7]och två par strumpor åt [C]lille, lille bror.

- id: blinka-lilla-stjarna
  title: Blinka lilla stjärna
  alternate_titles: [Twinkle, Twinkle, Little Star]
  language: Swedish
  description: |
    A Swedish version of the familiar nursery song, set to a melody also used by Mozart for twelve piano variations.

    A gentle choice for bedtime or a first melody on the piano.
  lyrics: |
    **Blinka, lilla stjärna där,**

    hur jag undrar vad du är.

    Fjärran lockar du min syn,

    lik en diamant i skyn.
  artist: [Traditional]
  author: [Traditional]
  composer: [Traditional]
  universe: [Traditional songs]
  source: Swedish nursery song
  tags: [bedtime, stars, calm, children]
  rights: public-domain

